name: Feature
description: A new capability or a visible improvement
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and what is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Sketch the behaviour, not the code.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checklist of observable outcomes.
      placeholder: |
        - [ ] ...
    validations:
      required: true
