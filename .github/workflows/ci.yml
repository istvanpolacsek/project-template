# The job name `ci` is what the rulesets require as a status check, keep it stable.
name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read # nx-set-shas looks up the last successful run

env:
  HUSKY: '0'
  NX_NO_CLOUD: 'true'

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - name: Format
        run: pnpm format:check
      - name: Environment variables are documented
        run: pnpm env:check
      - name: Tooling tests (hooks, scripts, workflows' helpers)
        run: pnpm test:tools
      - name: Lint, typecheck, test and build what changed
        run: pnpm nx affected -t lint typecheck test build
