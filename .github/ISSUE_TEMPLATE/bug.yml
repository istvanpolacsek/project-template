name: Bug
description: Something does not work as intended
type: Bug
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Include error messages, run links or screenshots.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where
      options:
        - staging
        - production
        - local
        - CI
    validations:
      required: true
