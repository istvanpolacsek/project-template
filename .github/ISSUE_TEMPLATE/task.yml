name: Task
description: Work that has to be done but is not a feature or a bug
type: Task
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What does this achieve and why now?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checklist of observable outcomes.
      placeholder: |
        - [ ] ...
    validations:
      required: true
